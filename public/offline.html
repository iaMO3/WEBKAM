<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WEBKAM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="mobile shell">
    <header class="topbar"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>WEBKAM</span></header>
    <section class="intro">
      <h1>Can’t reach your PC</h1>
      <p>Open WEBKAM on Windows and reconnect your phone using the same Wi-Fi or USB connection.</p>
    </section>
    <a href="/" class="button primary">Try again</a>
    <p class="offline-hint">If the PC address changed, scan its current QR code in Safari and add WEBKAM to your Home Screen again.</p>
  </main>
</body>
