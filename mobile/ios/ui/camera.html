<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src file:; script-src file:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="theme-color" content="#f2f6f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12191a" media="(prefers-color-scheme: dark)">
  <title>WEBKAM</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="camera.js"></script>
</head>
<body class="camera-app">
  <main class="mobile shell phone">
    <header class="topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span><span>WEBKAM<small>Camera studio</small></span></span>
      <span id="connection-chip" class="connection-chip" data-state="pending">Connecting</span>
    </header>
    <section class="intro camera-intro">
      <h1>Viewfinder</h1>
      <p id="phone-status" role="status">Connecting to your Windows PC…</p>
    </section>
    <form id="pair" class="mobile-panel pair-card" hidden>
      <label for="pin">Pairing code</label>
      <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="0000 0000" required>
      <button id="pair-button" class="primary" type="submit">Pair phone</button>
    </form>
    <button id="retry" class="button primary" type="button" hidden>Retry connection</button>
    <section id="camera" class="camera-workspace" aria-label="Camera controls" hidden>
      <div id="phone-stage" class="stage phone-stage" data-orientation="landscape" aria-label="Camera preview">
        <div id="camera-idle" class="stage-content">

          <span id="camera-idle-text">Camera is off</span>
        </div>
      </div>
      <div class="camera-controls">
        <p id="native-mode" class="camera-hint" hidden></p>
        <fieldset class="shot-control">
          <legend>Framing</legend>
          <button class="secondary" type="button" data-zoom="1" aria-pressed="true">Wide</button>
          <button class="secondary" type="button" data-zoom="1.35" aria-pressed="false">Standard</button>
          <button class="secondary" type="button" data-zoom="2.2" aria-pressed="false">Close</button>
        </fieldset>
        <fieldset class="shot-control">
          <legend>Camera</legend>
          <button class="secondary" type="button" data-facing="environment" aria-pressed="true">Rear</button>
          <button class="secondary" type="button" data-facing="user" aria-pressed="false">Front</button>
          <button id="camera-flash" class="secondary" type="button" aria-pressed="false" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13.5 2 4 14h7l-1 8 10-13h-7z"/></svg>
            <span id="light-label">Flash</span><span id="light-state" aria-hidden="true">Off</span>
          </button>
        </fieldset>
        <div class="lens-control">
          <label for="camera-picker">Camera lens</label>
          <select id="camera-picker"></select>
        </div>
        <button id="toggle" class="primary" type="button">Start camera</button>
        <p id="flash-note" class="camera-hint" role="status" hidden></p>
        <button id="float-camera" class="secondary" type="button" hidden>Floating preview</button>
      </div>
    </section>
  </main>
</body>
</html>
