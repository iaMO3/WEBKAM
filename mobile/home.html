<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>WEBKAM</title>
<style>
:root{color-scheme:light dark;font:16px -apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",sans-serif;color:#1d1d21;background:#f6f6f9;--surface:white;--muted:#565967;--line:#dcdde4;--field:#f4f4f7;--blue:#005fc6}
@media(prefers-color-scheme:dark){:root{color:#f4f4f7;background:#1b1c20;--surface:#25262c;--muted:#bbbcc7;--line:#43444e;--field:#303138;--blue:#0866c9}}
*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:32px 20px}h1{font-size:34px;line-height:1.15;letter-spacing:-.05em;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 22px}form{display:grid;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px}label{font-weight:600}input,button{font:inherit;color:inherit;border-radius:10px;padding:12px;width:100%}input{background:var(--field);border:1px solid var(--line)}button{min-height:46px;border:0;background:var(--field);font-weight:600}button.primary{background:var(--blue);color:white}small{color:var(--muted);line-height:1.45}#error:empty{display:none}:focus-visible{outline:3px solid #498df3;outline-offset:2px}

@media (prefers-reduced-motion: no-preference) {
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  .mobile-panel:not([hidden]), main > form { animation: arrive .24s ease-out both; }
  .stage video:not([hidden]), .stage-content:not([hidden]) { animation: reveal .22s ease-out; }
  details[open] > :not(summary) { animation: arrive .18s ease-out; }
  button, .button { transition: background-color .16s, transform .13s ease-out; }
  button:active, .button:active { transform: scale(.98); }
}
</style></head><body><main><h1>Connect to your PC</h1><p>Open WEBKAM on Windows and enter the address shown under the QR code.</p>
<form id="connect"><label for="address">PC address</label><input id="address" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="192.168.1.100">
<small id="error" role="alert"></small><button class="primary" type="submit">Open camera</button><button id="setup" type="button">First-time certificate setup</button><button id="usb" type="button" hidden>Use Android USB (ADB)</button></form></main>
<script>
const input = document.getElementById('address'), error = document.getElementById('error');
document.getElementById('usb').hidden = !/Android/i.test(navigator.userAgent);
function openPC(action) {
  let value = input.value.trim().replace(/^https?:\/\//i,'').replace(/\/$/,'');
  const match = /^(\d{1,3}(?:\.\d{1,3}){3})(?::(?:47744|47745|47746))?$/.exec(value);
  const ip = match && match[1].split('.').map(Number);
  const privateIP = ip && ip.every(n=>n<=255) && (ip[0]===10 || (ip[0]===192 && ip[1]===168) || (ip[0]===172 && ip[1]>=16 && ip[1]<=31));
  if (!privateIP) { error.textContent='Enter the local IPv4 address shown in WEBKAM.'; input.focus(); return; }
  location.href='pocketcam://'+action+'/'+ip.join('.');
}
document.getElementById('connect').onsubmit=e=>{e.preventDefault();openPC('camera')};
document.getElementById('setup').onclick=()=>openPC('setup');
document.getElementById('usb').onclick=()=>{location.href='pocketcam://usb/127.0.0.1'};
</script></body></html>
