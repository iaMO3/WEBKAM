<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>WEBKAM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header class="topbar"><span class="brand"><span class="brand-mark" aria-hidden="true"></span><span>WEBKAM<small>Camera studio</small></span></span></header>
  <section class="intro studio-cover">
    <h1>Connect your phone</h1>
    <p>Open WEBKAM on your computer to find its address.</p>
  </section>
  <form id="connect" class="mobile-panel">
    <label for="address">Computer address</label>
    <input id="address" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="192.168.1.100">
    <small id="error" role="alert"></small>
    <button class="primary" type="submit">Open camera</button>
    <button id="usb" class="secondary" type="button" hidden>Connect with Android USB</button>
  </form>
  <details class="mobile-panel home-screen-install">
    <summary>First-time setup</summary>
    <p>Install the certificate shown in WEBKAM on your computer. On iPhone, open the setup link in Safari to download the profile.</p>
    <button id="setup" class="button secondary" type="button">Open certificate setup</button>
  </details>
</main>
<script>
const input = document.getElementById('address'), error = document.getElementById('error');
document.getElementById('usb').hidden = !/Android/i.test(navigator.userAgent);
function openPC(action) {
  let value = input.value.trim().replace(/^https?:\/\//i,'').replace(/\/$/,'');
  const match = /^(\d{1,3}(?:\.\d{1,3}){3})(?::(?:47744|47745|47746))?$/.exec(value);
  const ip = match && match[1].split('.').map(Number);
  const privateIP = ip && ip.every(n=>n<=255) && (ip[0]===10 || (ip[0]===192 && ip[1]===168) || (ip[0]===172 && ip[1]>=16 && ip[1]<=31));
  if (!privateIP) { error.textContent='Enter the local IPv4 address shown in WEBKAM.'; input.focus(); return; }
  location.href='pocketcam://'+action+'/'+ip.join('.');
}
document.getElementById('connect').onsubmit=e=>{e.preventDefault();openPC('camera')};
document.getElementById('setup').onclick=()=>openPC('setup');
document.getElementById('usb').onclick=()=>{location.href='pocketcam://usb/127.0.0.1'};
</script></body></html>
